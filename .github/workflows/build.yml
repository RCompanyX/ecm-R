name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate solution
        run: .\generate.bat

      - name: Build
        run: msbuild build\ECM-R.sln /t:Overlay /p:Configuration=Release /p:Platform=Win-x86 /m

      - name: Verify output
        run: |
          if not exist "build\bin\Release-Win-x86\x86\ecm-r.x86.dll" exit /b 1
          if not exist "build\bin\Release-Win-x86\x86\ecm-r.x86.asi" exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecm-r-build
          path: build/bin/Release-Win-x86/x86/ecm-r.x86.asi
